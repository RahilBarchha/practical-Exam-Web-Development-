<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Registration Form(Depstar CE)</h1>
<p>Please fill out the form below.</p>

<form>

    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" required>
    <br><br>
    <label for="id">ID NO::</label><br>
    <input type="text" id="id"   required>
    <br><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone">
    <br><br>
    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
    <br><br>
    <label for="Event">Event:</label><br>
    <select id="Event" name="Event">
        <option>Select Event</option>
        <option>Technical Seminar</option>
        <option>Hackathon</option>
        <option>Web Development Frameworks</option>
        <option>Project Exhibition</option>
        </select>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>
<center>
    <footer>
         © 2026 Student Events CHARUSAT, Anand 
        </footer>
</center>

</body>
</html>
